<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="t">How claude-model-router works</title>
  <desc id="d">Four tasks arrive one at a time. The skill sends mechanical work to Haiku, user-visible work to Sonnet and payment or security work to Opus. A hook blocks Haiku from editing a UI file, so that task goes to Sonnet.</desc>
  <rect width="900" height="480" rx="16" fill="#0d1117"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">The cheapest model that can do the job, with the same quality</text>
  <text x="20" y="190" font-size="11.5" font-weight="700" fill="#8b949e" letter-spacing="1.5">YOUR TASK</text>
  <path d="M20,240 L290,240" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <rect x="285" y="170" width="190" height="140" rx="14" fill="#161b22" stroke="#6e7681" stroke-width="2"/>
  <text x="380" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e6edf3">claude-model-router</text>
  
  <rect x="640" y="70" width="220" height="100" rx="12" fill="#161b22" stroke="#3fb950" stroke-opacity="0.55" stroke-width="2"/>
  <text x="750" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#3fb950">Haiku</text>
  <text x="750" y="160" text-anchor="middle" font-size="11.5" fill="#8b949e">mechanical work · cheapest</text>
  <path d="M470,240 L640,120" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <rect x="640" y="190" width="220" height="100" rx="12" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.55" stroke-width="2"/>
  <text x="750" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#58a6ff">Sonnet</text>
  <text x="750" y="280" text-anchor="middle" font-size="11.5" fill="#8b949e">default · UI, features, tests</text>
  <path d="M470,240 L640,240" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <rect x="640" y="310" width="220" height="100" rx="12" fill="#161b22" stroke="#bc8cff" stroke-opacity="0.55" stroke-width="2"/>
  <text x="750" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#bc8cff">Opus</text>
  <text x="750" y="400" text-anchor="middle" font-size="11.5" fill="#8b949e">security, payments, hard bugs</text>
  <path d="M470,240 L640,360" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0;0.245" values="0;1;0"/>
    <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" path="M110,240 L380,240 L750,120" keyTimes="0;0;0.06;0.1;0.17;1" keyPoints="0;0;0.4097;0.4097;1;1"/>
    <rect x="-95" y="-17" width="190" height="34" rx="17" fill="#3fb950" fill-opacity="0.18" stroke="#3fb950" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Rename 40 files</text>
  </g>
  <text x="380" y="298" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.06;0.1" values="0;1;0"/>mechanical  →  Haiku</text>
  <rect x="640" y="70" width="220" height="100" rx="12" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-width="3" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.17;0.245" values="0;1;0"/></rect>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.25;0.495" values="0;1;0"/>
    <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" path="M110,240 L380,240 L750,240" keyTimes="0;0.25;0.31;0.35;0.42;1" keyPoints="0;0;0.4219;0.4219;1;1"/>
    <rect x="-95" y="-17" width="190" height="34" rx="17" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">New settings screen</text>
  </g>
  <text x="380" y="298" text-anchor="middle" font-size="12.5" font-weight="600" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.31;0.35" values="0;1;0"/>visible to users  →  Sonnet</text>
  <rect x="640" y="190" width="220" height="100" rx="12" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="3" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.42;0.495" values="0;1;0"/></rect>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.5;0.745" values="0;1;0"/>
    <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" path="M110,240 L380,240 L750,360" keyTimes="0;0.5;0.56;0.6;0.67;1" keyPoints="0;0;0.4097;0.4097;1;1"/>
    <rect x="-95" y="-17" width="190" height="34" rx="17" fill="#bc8cff" fill-opacity="0.18" stroke="#bc8cff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Fix payment webhook</text>
  </g>
  <text x="380" y="298" text-anchor="middle" font-size="12.5" font-weight="600" fill="#bc8cff" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.56;0.6" values="0;1;0"/>payments  →  always Opus</text>
  <rect x="640" y="310" width="220" height="100" rx="12" fill="#bc8cff" fill-opacity="0.16" stroke="#bc8cff" stroke-width="3" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.67;0.745" values="0;1;0"/></rect>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.75;0.995" values="0;1;0"/>
    <animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" path="M110,240 L380,240 L750,120 L750,240" keyTimes="0;0.75;0.8;0.83;0.875;0.91;0.945;1" keyPoints="0;0;0.3466;0.3466;0.846;0.846;1;1"/>
    <rect x="-95" y="-17" width="190" height="34" rx="17" fill="#f0883e" fill-opacity="0.18" stroke="#f0883e" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Haiku edits Button.tsx</text>
  </g>
  <text x="380" y="298" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f0883e" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.8;0.83" values="0;1;0"/>sent to Haiku by mistake…</text>
  <rect x="640" y="70" width="220" height="100" rx="12" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-width="3" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.875;0.91" values="0;1;0"/></rect>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.875;0.945" values="0;1;0"/>
    <rect x="650" y="40" width="200" height="24" rx="12" fill="#ff7b72" fill-opacity="0.2" stroke="#ff7b72" stroke-width="2"/>
    <text x="750" y="57" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ff7b72">BLOCKED by hook: UI file</text>
  </g>
  <rect x="640" y="190" width="220" height="100" rx="12" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-width="3" opacity="0">
    <animate attributeName="opacity" calcMode="discrete" dur="20s" repeatCount="indefinite" keyTimes="0;0.945;0.995" values="0;1;0"/></rect>
  <text x="450" y="443" text-anchor="middle" font-size="12.5" fill="#8b949e">Hooks stop Haiku from editing UI files and stop Haiku and Sonnet from touching security or payment code.</text>
  <text x="450" y="464" text-anchor="middle" font-size="12.5" fill="#8b949e">Security and payments always go to Opus.</text>
</svg>
